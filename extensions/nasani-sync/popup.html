<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nasani Sync</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00d2d3, #0984e3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }
        .desc {
            font-size: 11px;
            color: #94a3b8;
            margin: 2px 0 0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            height: 34px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            color: #fff;
            padding: 0 10px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: #00d2d3;
            background: rgba(255, 255, 255, 0.08);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            margin-bottom: 14px;
            user-select: none;
        }
        .checkbox-label input {
            accent-color: #00d2d3;
            width: 15px;
            height: 15px;
            margin: 0;
        }
        .btn-sync {
            width: 100%;
            height: 38px;
            background: linear-gradient(135deg, #00d2d3, #0984e3);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 210, 211, 0.3);
        }
        .btn-sync:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status-box {
            margin-top: 14px;
            padding: 10px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11.5px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .status-box b {
            color: #e2e8f0;
        }
        .notice {
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-icon">⚡</div>
        <div>
            <h1 class="title">Nasani Sync</h1>
            <p class="desc">Đồng bộ Deadline sang RBWManager</p>
        </div>
    </div>

    <div class="form-group">
        <label for="api-url">Địa chỉ Tool RBWManager (Local)</label>
        <input type="text" id="api-url" value="http://localhost/RBWManager/api.php" placeholder="http://localhost/RBWManager/api.php">
    </div>

    <label class="checkbox-label">
        <input type="checkbox" id="auto-sync" checked>
        <span>Tự động đồng bộ khi mở danh sách kỹ thuật</span>
    </label>

    <button type="button" class="btn-sync" id="btn-manual-sync">
        <span>⚡ Đồng bộ ngay bây giờ</span>
    </button>

    <div class="status-box" id="status-info">
        <div>Trạng thái: <b>Sẵn sàng</b></div>
        <div id="last-sync-time">Lần cuối: Chưa đồng bộ</div>
    </div>

    <p class="notice">Mở trang projects.nasani.vn/ky-thuat/program/list/ để đồng bộ</p>

    <script src="popup.js"></script>
</body>
</html>
